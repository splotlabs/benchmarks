# Campaign plan template. Copy it, edit it, then run:
#   ./bench lock my-plan.toml -o my-lock.json
# `bench lock` resolves every `select` once and writes the lock. Later commands read only the lock.

# Campaign name. The campaign id is this name plus 12 hex digits of the lock digest.
name = "example-campaign"
# "standard" for real decoders. "synthetic" is for harness tests and allows only the `fixture` adapter.
origin = "standard"
# "quick" (six 1920x1080 streams) or "full" (every stream from 1280x720 up), see corpus/suites.toml.
# A quick campaign has its own id and is not a full campaign.
suite = "quick"

warmups = 1                   # untimed rounds before the timed rounds of a cell
repetitions = 5               # timed rounds per cell
timeout_s = 1800              # per decoder process
order_seed = 1                # seed of the decoder-order rotation
noise_max_range_permille = 50 # (max - min) / median above this marks a cell noisy (50 = 5.0 %)

# Each implementation: a branch, a tag or a full 40-hex commit in `select`.
# The lock records the commit. `release` is set only when an upstream tag that fully
# matches `release_tag_pattern` points at exactly that commit; otherwise it is a development build.

[[implementation]]
id = "splot"
name = "Splot"
adapter = "splot"
repository = "https://github.com/splotlabs/splot.git"
select = "main"
release_tag_pattern = 'v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
release_url_template = "https://github.com/splotlabs/splot/releases/tag/{tag}"

[[implementation]]
id = "dav2d"
name = "dav2d"
adapter = "dav2d"
repository = "https://code.videolan.org/videolan/dav2d.git"
select = "main"
release_tag_pattern = '(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
release_url_template = "https://code.videolan.org/videolan/dav2d/-/tags/{tag}"

[[implementation]]
id = "avmdec"
name = "avmdec"
adapter = "avm"
repository = "https://github.com/AOMediaCodec/avm.git"
select = "main"
# The research-v* tags are not releases of the final codec. This pattern must not match them.
release_tag_pattern = 'v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'
release_url_template = "https://github.com/AOMediaCodec/avm/releases/tag/{tag}"

# Host roles. A role needs a native machine of that architecture. Adjust the thread lists
# to the cores of your machines; the lock records them.

[roles.arm64]
arch = "aarch64"
threads = [1, 2, 4, 8]

[roles.x86-64]
arch = "x86_64"
threads = [1, 2, 4, 8, 16]
